<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Revo-FX</title>
<style>
:root{--bg:#0e0f11;--panel:#c9ccd1;--panel2:#b4b8be;--ink:#15171a;--acc:#ff5a1f;--dim:#6b7078}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#e8e9eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select,.btn{background:#1b1e22;color:#e8e9eb;border:1px solid #2c3036;border-radius:10px;padding:10px 12px;font-size:14px;min-height:44px}
.bar select{max-width:230px;flex:1 1 150px}
.btn{cursor:pointer;font-weight:600;letter-spacing:.04em}
.btn.on{background:var(--acc);border-color:var(--acc);color:#111}
.btn.big{font-size:18px;padding:10px 26px}
.spacer{flex:1}
.title{font-weight:800;letter-spacing:.18em;font-size:15px}
.title small{color:var(--dim);font-weight:500;letter-spacing:.05em;margin-left:8px}
#status{font-size:12px;color:var(--dim)}
.unit{flex:1;min-height:0;background:linear-gradient(160deg,var(--panel),var(--panel2));border-radius:18px;color:var(--ink);padding:16px 20px;display:grid;grid-template-columns:4fr 2.2fr 2.2fr;gap:18px;box-shadow:inset 0 1px 0 #fff8,0 8px 30px #0008}
.grp{display:flex;flex-direction:column;border-left:2px solid #0002;padding-left:16px}
.grp:first-child{border:0;padding:0}
.grp h3{margin:0 0 6px;font-size:12px;letter-spacing:.2em;color:#3a3e44}
.row{flex:1;display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap}
.k{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:88px}
.knob{position:relative;width:clamp(72px,11vw,112px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:ns-resize;
 background:conic-gradient(from -135deg,var(--acc) calc(var(--v)*270deg),#0003 0 270deg,transparent 0)}
.knob::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3d42,#111 70%);box-shadow:0 4px 10px #0007}
.knob i{position:absolute;left:50%;top:14%;width:4px;height:24%;margin-left:-2px;border-radius:2px;background:#fff;
 transform-origin:50% 262%;transform:rotate(calc(-135deg + var(--v)*270deg))}
.k label{font-size:12px;font-weight:700;letter-spacing:.12em}
.k output{font-size:12px;color:#40454c;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg .btn{background:#2a2d32;min-height:40px;padding:8px 12px;font-size:13px}
.seg .btn.on{background:var(--acc);color:#111}
.meters{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
.m{width:90px;height:10px;background:#1b1e22;border-radius:5px;overflow:hidden}
.m div{height:100%;width:0;background:linear-gradient(90deg,#3fd17a 70%,#ffd23f 85%,#ff4040)}
.sl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.sl input{width:90px;touch-action:auto}
@media (max-width:820px){.unit{grid-template-columns:1fr;overflow:auto}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="title">REVO-FX<small>reverb + tremolo</small></span>
    <button id="start" class="btn big">▶ AVVIA</button>
    <select id="inSel" title="Ingresso"><option value="">Ingresso predefinito</option><option value="__test">Segnale di prova</option></select>
    <select id="outSel" title="Uscita"><option value="">Uscita predefinita</option></select>
    <span class="spacer"></span>
    <div class="meters">IN<div class="m"><div id="mIn"></div></div>OUT<div class="m"><div id="mOut"></div></div></div>
    <div class="sl">IN<input id="inG" type="range" min="0" max="1" step="0.01"></div>
    <div class="sl">OUT<input id="outG" type="range" min="0" max="1" step="0.01"></div>
  </div>

  <div class="unit">
    <div class="grp"><h3>REVERB</h3><div class="row" id="gRev"></div></div>
    <div class="grp"><h3>TREMOLO</h3><div class="row" id="gTrem"></div>
      <div class="seg" style="margin-top:8px">
        <button class="btn" data-div="1">1/4</button><button class="btn" data-div="2">1/8</button><button class="btn" data-div="4">1/16</button>
        <button class="btn" data-shape="sine">SINE</button><button class="btn" data-shape="square">GATE</button>
      </div>
      <div class="seg" style="margin-top:8px"><button id="tap" class="btn" style="min-width:130px;min-height:52px">TAP</button></div>
    </div>
    <div class="grp"><h3>NOISE / FILTER</h3><div class="row" id="gNoise"></div>
      <div class="seg" style="margin-top:8px">
        <button class="btn" data-mode="MIX">MIX</button><button class="btn" data-mode="WET">WET</button>
        <button id="fx" class="btn">FX ON</button>
      </div>
    </div>
  </div>
  <div id="status">Premi AVVIA. Usa cuffie o l'uscita verso la console: se il segnale esce dagli altoparlanti del tablet può innescare feedback.</div>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const DEF = {reverb:.4, character:.5, length:.5, air:.5, tremolo:0, tempo:.5, noise:0, filter:0, inG:.5, outG:.5};
const S = {...DEF, mode:'MIX', div:2, shape:'sine', fx:true, inDev:'', outDev:''};
try { Object.assign(S, JSON.parse(localStorage.getItem('revofx') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('revofx', JSON.stringify(S)); } catch (e) {} };
const bpm = () => Math.round(40 + 160 * S.tempo);

/* ---------- AUDIO ---------- */
let ctx = null, N = {}, src = null, stream = null, test = null, running = false;
const COMB = [1116,1188,1277,1356,1422,1491,1557,1617], AP = [556,441,341,225];

function allpass(x, t, g) {
  const s = ctx.createGain(), d = ctx.createDelay(1), fb = ctx.createGain(), ng = ctx.createGain(), out = ctx.createGain();
  d.delayTime.value = t; fb.gain.value = g; ng.gain.value = -g;
  x.connect(s); s.connect(d); d.connect(fb); fb.connect(s); s.connect(ng); ng.connect(out); d.connect(out);
  return out;
}
function tank(spread) {              // Freeverb-style: 8 comb paralleli + 4 allpass in serie
  const input = ctx.createGain(); input.gain.value = 0.015;
  const sum = ctx.createGain(), damps = [], fbs = [];
  COMB.forEach(n => {
    const d = ctx.createDelay(1); d.delayTime.value = (n + spread) / 44100;
    const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.Q.value = .5; damp.frequency.value = 6000;
    const fb = ctx.createGain(); fb.gain.value = .84;
    input.connect(d); d.connect(sum); d.connect(damp); damp.connect(fb); fb.connect(d);
    damps.push(damp); fbs.push(fb);
  });
  let node = sum;
  AP.forEach(n => { node = allpass(node, (n + spread) / 44100, .5); });
  return {input, output: node, damps, fbs};
}

function build() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'});
  const g = () => ctx.createGain(), bq = t => { const f = ctx.createBiquadFilter(); f.type = t; return f; };
  N.inGain = g(); N.inGain.channelCount = 2; N.inGain.channelCountMode = 'explicit'; N.inGain.channelInterpretation = 'speakers';
  N.dry = g(); N.master = g();
  N.comp = ctx.createDynamicsCompressor();      // limiter di sicurezza
  Object.assign(N.comp, {}); N.comp.threshold.value = -2; N.comp.knee.value = 0; N.comp.ratio.value = 20; N.comp.attack.value = .002; N.comp.release.value = .1;
  N.tanks = [tank(0), tank(23)];
  const split = ctx.createChannelSplitter(2), merge = ctx.createChannelMerger(2);
  N.inGain.connect(split);
  split.connect(N.tanks[0].input, 0); split.connect(N.tanks[1].input, 1);
  N.tanks[0].output.connect(merge, 0, 0); N.tanks[1].output.connect(merge, 0, 1);
  N.reverbLvl = g(); N.air = bq('highshelf'); N.air.frequency.value = 6000; N.wetSum = g();
  merge.connect(N.reverbLvl); N.reverbLvl.connect(N.air); N.air.connect(N.wetSum);
  // rumore bianco: nel riverbero e diretto
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true; ns.start();
  N.noiseTank = g(); N.noiseDirect = g();
  ns.connect(N.noiseTank); ns.connect(N.noiseDirect);
  N.noiseTank.connect(N.tanks[0].input); N.noiseTank.connect(N.tanks[1].input); N.noiseDirect.connect(N.wetSum);
  // filtro passa-alto -> tremolo -> uscita FX
  N.hpf = bq('highpass'); N.hpf.Q.value = .7; N.trem = g(); N.fx = g();
  N.wetSum.connect(N.hpf); N.hpf.connect(N.trem); N.trem.connect(N.fx); N.fx.connect(N.master);
  N.lfo = ctx.createOscillator(); N.lfoLp = bq('lowpass'); N.lfoLp.frequency.value = 40; N.lfoAmt = g();
  N.lfo.connect(N.lfoLp); N.lfoLp.connect(N.lfoAmt); N.lfoAmt.connect(N.trem.gain); N.lfo.start();
  N.inGain.connect(N.dry); N.dry.connect(N.master);
  N.master.connect(N.comp);
  N.anIn = ctx.createAnalyser(); N.anOut = ctx.createAnalyser(); N.anIn.fftSize = N.anOut.fftSize = 512;
  N.inGain.connect(N.anIn); N.comp.connect(N.anOut); N.comp.connect(ctx.destination);
}

const set = (p, v) => p.setTargetAtTime(v, ctx.currentTime, .03);
function apply() {
  if (!ctx) return;
  set(N.inGain.gain, S.inG * 2);
  set(N.master.gain, S.outG * 2);
  set(N.reverbLvl.gain, Math.pow(S.reverb, 1.5) * 3);
  const damp = 600 * Math.pow(20, S.character), fb = .7 + .28 * S.length;
  N.tanks.forEach(t => { t.damps.forEach(x => set(x.frequency, damp)); t.fbs.forEach(x => set(x.gain, fb)); });
  set(N.air.gain, (S.air - .5) * 24);
  set(N.noiseTank.gain, S.noise * S.noise * .35);
  set(N.noiseDirect.gain, S.noise * S.noise * .12);
  set(N.hpf.frequency, 20 * Math.pow(100, S.filter));
  set(N.trem.gain, 1 - S.tremolo / 2); set(N.lfoAmt.gain, S.tremolo / 2);
  set(N.lfo.frequency, bpm() / 60 * S.div); N.lfo.type = S.shape;
  set(N.dry.gain, S.mode === 'MIX' ? 1 : 0);
  set(N.fx.gain, S.fx ? 1 : 0);
}

/* segnale di prova */
function startTest() {
  stopTest();
  const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 196;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
  const e = ctx.createGain(); e.gain.value = 0; o.connect(f); f.connect(e); e.connect(N.inGain); o.start();
  test = {o, e, t: 0};
  const step = () => {
    if (!test) return; const t = ctx.currentTime;
    e.gain.cancelScheduledValues(t); e.gain.setValueAtTime(.0001, t);
    e.gain.linearRampToValueAtTime(.5, t + .005); e.gain.exponentialRampToValueAtTime(.001, t + .25);
    test.t = setTimeout(step, 60000 / bpm());
  };
  step();
}
function stopTest() { if (test) { clearTimeout(test.t); try { test.o.stop(); } catch (e) {} test.o.disconnect(); test.e.disconnect(); test = null; } }

async function openInput() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (src) { src.disconnect(); src = null; }
  if (S.inDev === '__test') { startTest(); return; }
  stopTest();
  stream = await navigator.mediaDevices.getUserMedia({audio: {
    deviceId: S.inDev ? {exact: S.inDev} : undefined,
    echoCancellation: false, noiseSuppression: false, autoGainControl: false,
    channelCount: {ideal: 2}, latency: {ideal: 0}}});
  src = ctx.createMediaStreamSource(stream); src.connect(N.inGain);
}

async function listDevices() {
  const devs = await navigator.mediaDevices.enumerateDevices();
  const fill = (sel, kind, first) => {
    const keep = sel.value; sel.length = first;
    devs.filter(d => d.kind === kind).forEach((d, i) => sel.add(new Option(d.label || `${kind} ${i + 1}`, d.deviceId)));
    sel.value = keep;
  };
  fill($('#inSel'), 'audioinput', 2); fill($('#outSel'), 'audiooutput', 1);
  $('#inSel').value = S.inDev; $('#outSel').value = S.outDev;
  $('#outSel').disabled = !(ctx && ctx.setSinkId);
}

async function start() {
  const st = $('#status');
  try {
    if (!ctx) { build(); apply(); }
    await ctx.resume();
    await openInput();
    await listDevices();
    if (S.outDev && ctx.setSinkId) { try { await ctx.setSinkId(S.outDev); } catch (e) {} }
    running = true; $('#start').textContent = '■ STOP'; $('#start').classList.add('on');
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen'); } catch (e) {}
    const lat = Math.round(((ctx.baseLatency || 0) + (ctx.outputLatency || 0)) * 1000);
    st.textContent = `Attivo · ${ctx.sampleRate} Hz · latenza stimata ≈ ${lat} ms`;
  } catch (err) { st.textContent = 'Errore audio: ' + err.message; }
}
async function stop() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  stopTest(); if (ctx) await ctx.suspend();
  running = false; $('#start').textContent = '▶ AVVIA'; $('#start').classList.remove('on');
  $('#status').textContent = 'Fermo.';
}

/* ---------- UI ---------- */
const KNOBS = [
  ['gRev', 'reverb', 'REVERB'], ['gRev', 'character', 'CHARACTER'], ['gRev', 'length', 'LENGTH'], ['gRev', 'air', 'AIR'],
  ['gTrem', 'tremolo', 'TREMOLO'], ['gTrem', 'tempo', 'TEMPO'],
  ['gNoise', 'noise', 'NOISE'], ['gNoise', 'filter', 'FILTER']];
const knobEls = {};
function show(id) {
  const k = knobEls[id]; k.el.style.setProperty('--v', S[id]);
  k.out.textContent = id === 'tempo' ? bpm() + ' BPM' : Math.round(S[id] * 100);
}
KNOBS.forEach(([grp, id, label]) => {
  const w = document.createElement('div'); w.className = 'k';
  w.innerHTML = `<div class="knob"><i></i></div><label>${label}</label><output></output>`;
  $('#' + grp).appendChild(w);
  const el = $('.knob', w), out = $('output', w); knobEls[id] = {el, out};
  let y0, v0, lastTap = 0;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = S[id];
    const now = Date.now(); if (now - lastTap < 300) { S[id] = DEF[id]; show(id); apply(); save(); } lastTap = now;
  });
  el.addEventListener('pointermove', e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    S[id] = Math.min(1, Math.max(0, v0 + (y0 - e.clientY) / 220)); show(id); apply();
  });
  el.addEventListener('pointerup', save);
  show(id);
});

function sync() {
  document.querySelectorAll('[data-div]').forEach(b => b.classList.toggle('on', +b.dataset.div === S.div));
  document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('on', b.dataset.shape === S.shape));
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('#fx').classList.toggle('on', S.fx); $('#fx').textContent = S.fx ? 'FX ON' : 'FX OFF';
  $('#inG').value = S.inG; $('#outG').value = S.outG;
}
document.querySelectorAll('[data-div]').forEach(b => b.onclick = () => { S.div = +b.dataset.div; sync(); apply(); save(); });
document.querySelectorAll('[data-shape]').forEach(b => b.onclick = () => { S.shape = b.dataset.shape; sync(); apply(); save(); });
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; sync(); apply(); save(); });
$('#fx').onclick = () => { S.fx = !S.fx; sync(); apply(); save(); };
$('#inG').oninput = e => { S.inG = +e.target.value; apply(); save(); };
$('#outG').oninput = e => { S.outG = +e.target.value; apply(); save(); };
$('#start').onclick = () => running ? stop() : start();
$('#inSel').onchange = async e => { S.inDev = e.target.value; save(); if (running) { try { await openInput(); } catch (err) { $('#status').textContent = err.message; } } };
$('#outSel').onchange = async e => { S.outDev = e.target.value; save(); if (ctx && ctx.setSinkId) { try { await ctx.setSinkId(S.outDev); } catch (err) {} } };

/* tap tempo */
let taps = [];
function tap() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now); taps = taps.slice(-5);
  if (taps.length > 1) {
    const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
    S.tempo = Math.min(1, Math.max(0, (60000 / iv - 40) / 160)); show('tempo'); apply(); save();
  }
}
$('#tap').addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') tap(); });

/* meter */
const buf = new Float32Array(512);
function level(an) { an.getFloatTimeDomainData(buf); let p = 0; for (const v of buf) p = Math.max(p, Math.abs(v)); return p; }
function frame() {
  if (ctx && running) {
    $('#mIn').style.width = Math.min(100, Math.max(0, (20 * Math.log10(level(N.anIn) || 1e-5) + 60) / 60 * 100)) + '%';
    $('#mOut').style.width = Math.min(100, Math.max(0, (20 * Math.log10(level(N.anOut) || 1e-5) + 60) / 60 * 100)) + '%';
  }
  requestAnimationFrame(frame);
}
sync(); frame();
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => running && listDevices());
})();
</script>
</body>
</html>
